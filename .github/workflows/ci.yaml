---
name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/**"
      - "docs/**"
      - "mkdocs.yaml"
      - "requirements.txt"
      - ".pre-commit-config.yaml"
      - ".yamllint.yaml"
      - ".hadolint.yaml"
      - "renovate.json"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  commit-msg:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            build
            revert

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files -v

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## 🧹 Lint Results"
            echo ""
            echo "| Check | Tool |"
            echo "|-------|------|"
            echo "| Trailing whitespace | pre-commit |"
            echo "| End of file fixer | pre-commit |"
            echo "| YAML syntax | pre-commit |"
            echo "| Merge conflicts | pre-commit |"
            echo "| Large files | pre-commit |"
            echo "| JSON syntax | pre-commit |"
            echo "| TOML syntax | pre-commit |"
            echo "| Case conflicts | pre-commit |"
            echo "| Private keys | pre-commit |"
            echo "| No commit to main | pre-commit |"
            echo "| YAML style | yamllint |"
            echo "| Dockerfile | hadolint |"
            echo "| GitHub Actions workflows | actionlint |"
            echo "| Commit message | conventional-commits |"
            echo "| Renovate config | renovate-config-validator |"
          } >> "$GITHUB_STEP_SUMMARY"

  changes:
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'

  docker-preview:
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.dockerfile == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push preview image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ttl.sh/vikas027/k8s-flagger-tester:6h-${{ github.event.pull_request.number }}-${{ steps.sha.outputs.short }}

      - name: Write image summary
        run: |
          {
            echo "## Docker Preview Image"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| **Image** | \`ttl.sh/vikas027/k8s-flagger-tester:6h-${{ github.event.pull_request.number }}-${{ steps.sha.outputs.short }}\` |"
            echo "| **PR** | #${{ github.event.pull_request.number }} |"
            echo "| **SHA** | \`${{ steps.sha.outputs.short }}\` |"
            echo ""
            echo "> Image expires after 6 hours (ttl.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [docker-preview, changes]
    if: needs.changes.outputs.dockerfile == 'true'
    steps:
      - name: Set image reference
        id: meta
        run: echo "image=ttl.sh/vikas027/k8s-flagger-tester:6h-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Scan image with Trivy (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: "table"
          output: "trivy-results.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"
          ignore-unfixed: true

      - name: Scan image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-results.sarif

      - name: Generate scan summary
        if: always()
        run: |
          {
            echo "## 🔍 Security Scan Results"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| **Image** | \`${{ steps.meta.outputs.image }}\` |"
            echo "| **Severity** | CRITICAL, HIGH, MEDIUM |"
            echo "| **Ignore Unfixed** | Yes |"
            echo ""
            if [ -s trivy-results.txt ]; then
              echo "### 📋 Vulnerabilities Found"
              echo ""
              echo '```'
              cat trivy-results.txt
              echo '```'
            else
              echo "✅ **No vulnerabilities found**"
            fi
            echo ""
            echo "---"
            echo "[Trivy Documentation](https://aquasecurity.github.io/trivy/)"
          } >> "$GITHUB_STEP_SUMMARY"
